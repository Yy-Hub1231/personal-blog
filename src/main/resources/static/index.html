<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>个人博客</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .cover-img{
            width:80px;
            height:50px;
            object-fit:cover;
            border-radius:4px;
        }
        .tag-item{
            display:inline-block;
            background:#0d6efd;
            color:#fff;
            padding:2px 6px;
            border-radius:4px;
            font-size:12px;
            margin:2px;
        }
    </style>
</head>
<body class="bg-light">
<div class="container mt-4">
    <h2 class="text-center">个人博客后台</h2>
    <hr>

    <!-- 登录区域 -->
    <div id="loginBox">
        <h4>管理员登录</h4>
        <div class="row">
            <div class="col-4">
                <input type="text" id="username" class="form-control mb-2" placeholder="用户名admin">
                <input type="password" id="password" class="form-control mb-2" placeholder="密码123456">
                <button onclick="login()" class="btn btn-primary">登录</button>
            </div>
        </div>
    </div>

    <!-- 主页面 -->
    <div id="mainBox" style="display:none;">
        <div class="d-flex justify-content-between align-items-center">
            <h4>文章管理</h4>
            <div>
                <button class="btn btn-success me-2" onclick="openAddModal()">新增文章</button>
                <button class="btn btn-danger" onclick="logout()">退出登录</button>
            </div>
        </div>
        <hr>
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>序号</th>
                <th>ID</th>
                <th>封面</th>
                <th>标题</th>
                <th>分类</th>
                <th>标签</th>
                <th>作者</th>
                <th>状态</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody id="articleTableBody"></tbody>
        </table>
    </div>

    <!-- 弹窗 -->
    <div class="modal fade" id="articleModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="modalTitle">文章编辑</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="artId">
                    <div class="mb-3">
                        <label>标题</label>
                        <input type="text" id="artTitle" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>作者</label>
                        <input type="text" id="artAuthor" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label>文章分类</label>
                        <select id="artCategoryId" class="form-select">
                            <!-- JS自动填充分类选项 -->
                        </select>
                    </div>
                    <div class="mb-3">
                        <label>文章标签（可多选）</label>
                        <div id="tagCheckGroup">
                            <!-- JS渲染标签多选框 -->
                        </div>
                    </div>
                    <div class="mb-3">
                        <label>封面图片地址（例如 /images/blog.jpg）</label>
                        <input type="text" id="artCover" class="form-control" oninput="refreshCoverPreview()">
                    </div>
                    <div class="mb-3">
                        <label>封面预览</label>
                        <div id="coverPreviewBox" class="border rounded p-2 bg-white text-center" style="min-height:120px; display:none;">
                            <img id="coverPreviewImg" class="img-fluid" style="max-height:180px; object-fit:contain;" />
                        </div>
                        <div id="coverEmptyTip" class="text-muted" style="font-size:13px;">暂未输入封面地址</div>
                    </div>
                    <div class="mb-3">
                        <label>内容</label>
                        <textarea id="artContent" class="form-control" rows="6"></textarea>
                    </div>
                    <div class="mb-3">
                        <label>状态(1发布 0草稿)</label>
                        <input type="number" id="artStatus" class="form-control" value="1">
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                    <button onclick="saveArticle()" class="btn btn-primary">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const baseUrl = "http://localhost:8080";
    let token = localStorage.getItem("token");
    let categoryList = []; // 缓存分类列表
    let tagList = [];      // 缓存全部标签

    window.onload = function () {
        if(token){
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("mainBox").style.display = "block";
            loadCategoryList();
            loadTagList();
            loadArticleList();
        }
    }

    // 登录
    async function login(){
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const res = await fetch(`${baseUrl}/admin/login`,{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({username,password})
        })
        const data = await res.json();
        if(data.code === 200){
            token = data.data.tokenHead + data.data.token;
            localStorage.setItem("token", token);
            alert("登录成功");
            document.getElementById("loginBox").style.display = "none";
            document.getElementById("mainBox").style.display = "block";
            loadCategoryList();
            loadTagList();
            loadArticleList();
        }else{
            alert(data.message);
        }
    }

    // 登出
    async function logout(){
        if(!confirm("确认退出登录？")) return;
        // 调用后端登出接口
        await fetch(`${baseUrl}/admin/logout`,{
            method:"POST",
            headers:{"Authorization":token}
        })
        // 清空本地token
        localStorage.removeItem("token");
        token = null;
        // 切回登录页面
        document.getElementById("loginBox").style.display = "block";
        document.getElementById("mainBox").style.display = "none";
    }

    // 加载所有分类，填充下拉框（blog分类接口）
    async function loadCategoryList(){
        const res = await fetch(`${baseUrl}/blog/category/getAllCategory`,{
            headers:{"Authorization":token}
        })
        const data = await res.json();
        if(data.code === 200){
            categoryList = data.data;
            renderCategorySelect();
        }
    }

    // 加载全部标签
    async function loadTagList(){
        const res = await fetch(`${baseUrl}/blog/tag/getAllTag`,{
            headers:{"Authorization":token}
        })
        const data = await res.json();
        if(data.code === 200){
            tagList = data.data;
        }
    }

    // 渲染分类下拉选择框
    function renderCategorySelect(selectedId = null){
        const selectDom = document.getElementById("artCategoryId");
        selectDom.innerHTML = "";
        categoryList.forEach(item=>{
            const opt = document.createElement("option");
            opt.value = item.id;
            opt.innerText = item.name;
            if(selectedId != null && item.id == selectedId){
                opt.selected = true;
            }
            selectDom.appendChild(opt);
        })
    }

    // 渲染标签多选框，支持回填已选中标签id数组
    function renderTagCheck(checkedTagIds = []){
        const wrap = document.getElementById("tagCheckGroup");
        wrap.innerHTML = "";
        tagList.forEach(tag=>{
            const div = document.createElement("div");
            div.className="form-check form-check-inline";
            const checked = checkedTagIds.includes(tag.id) ? "checked" : "";
            div.innerHTML = `
                <input class="form-check-input" type="checkbox" value="${tag.id}" id="tag_${tag.id}" ${checked}>
                <label class="form-check-label" for="tag_${tag.id}">${tag.name}</label>
            `
            wrap.appendChild(div);
        })
    }

    // 获取选中的标签ID数组
    function getCheckedTagIds(){
        const inputs = document.querySelectorAll("#tagCheckGroup input:checked");
        const ids = [];
        inputs.forEach(i=> ids.push(Number(i.value)))
        return ids;
    }

    // 获取文章列表【blog文章接口】
    async function loadArticleList(){
        const res = await fetch(`${baseUrl}/blog/article/list?pageNum=1&pageSize=10`,{
            headers:{"Authorization":token}
        })
        const data = await res.json();
        let html = "";
        // itemIndex就是前端序号，从0开始+1，永远连续
        data.data.list.forEach((item, itemIndex)=>{
            let coverHtml = item.cover ? `<img src="${item.cover}" class="cover-img">` : `<span class="text-muted">无封面</span>`
            // 找到当前文章对应的分类名称
            const category = categoryList.find(c => c.id === item.categoryId);
            const categoryName = category ? category.name : "未分类";
            // 拼接标签展示
            let tagHtml = "";
            if(item.tagList && item.tagList.length>0){
                item.tagList.forEach(t=>{
                    tagHtml += `<span class="tag-item">${t.name}</span>`
                })
            }else{
                tagHtml = `<span class="text-muted">无标签</span>`
            }
            html += `
            <tr>
                <td>${itemIndex + 1}</td>
                <td>${item.id}</td>
                <td>${coverHtml}</td>
                <td>${item.title}</td>
                <td>${categoryName}</td>
                <td>${tagHtml}</td>
                <td>${item.author}</td>
                <td>${item.status ===1 ? "已发布":"草稿"}</td>
                <td>
                    <button class="btn btn-sm btn-info" onclick="editArticle(${JSON.stringify(item).replace(/"/g,'&quot;')})">编辑</button>
                    <button class="btn btn-sm btn-danger" onclick="delArticle(${item.id})">删除</button>
                </td>
            </tr>`
        })
        document.getElementById("articleTableBody").innerHTML = html;
    }

    // 封面预览
    function refreshCoverPreview(){
        const coverUrl = document.getElementById("artCover").value.trim();
        const previewBox = document.getElementById("coverPreviewBox");
        const previewImg = document.getElementById("coverPreviewImg");
        const emptyTip = document.getElementById("coverEmptyTip");
        if(coverUrl){
            previewImg.src = coverUrl;
            previewBox.style.display = "block";
            emptyTip.style.display = "none";
        }else{
            previewImg.src = "";
            previewBox.style.display = "none";
            emptyTip.style.display = "block";
        }
    }

    // 打开新增弹窗
    function openAddModal(){
        document.getElementById("artId").value = "";
        document.getElementById("artTitle").value = "";
        document.getElementById("artAuthor").value = "";
        document.getElementById("artCover").value = "";
        document.getElementById("artContent").value = "";
        document.getElementById("artStatus").value = 1;
        document.getElementById("modalTitle").innerText = "新增文章";
        refreshCoverPreview();
        renderCategorySelect();
        renderTagCheck([]); // 新增，标签默认不选中
        new bootstrap.Modal(document.getElementById('articleModal')).show();
    }

    // 编辑文章，回填分类+标签
    function editArticle(item){
        document.getElementById("artId").value = item.id;
        document.getElementById("artTitle").value = item.title;
        document.getElementById("artAuthor").value = item.author;
        document.getElementById("artCover").value = item.cover;
        document.getElementById("artContent").value = item.content;
        document.getElementById("artStatus").value = item.status;
        document.getElementById("modalTitle").innerText = "文章编辑";
        refreshCoverPreview();
        renderCategorySelect(item.categoryId);
        // 获取当前文章标签id数组回填勾选
        const tagIds = item.tagList ? item.tagList.map(t=>t.id) : [];
        renderTagCheck(tagIds);
        new bootstrap.Modal(document.getElementById('articleModal')).show();
    }

    // 保存文章，提交categoryId + tagIds数组
    async function saveArticle(){
        const id = document.getElementById("artId").value;
        const tagIds = getCheckedTagIds();
        const article = {
            id: id ? Number(id) : null,
            title: document.getElementById("artTitle").value,
            author: document.getElementById("artAuthor").value,
            cover: document.getElementById("artCover").value,
            content: document.getElementById("artContent").value,
            status: Number(document.getElementById("artStatus").value),
            categoryId: Number(document.getElementById("artCategoryId").value),
            tagIds: tagIds
        }
        // 重点：新增用 /blog/article/create，修改用 /blog/article/update
        const url = id ? `${baseUrl}/blog/article/update` : `${baseUrl}/blog/article/create`;
        const res = await fetch(url,{
            method:"POST",
            headers:{
                "Content-Type":"application/json",
                "Authorization":token
            },
            body:JSON.stringify(article)
        })
        const data = await res.json();
        if(data.code === 200){
            alert("保存成功");
            bootstrap.Modal.getInstance(document.getElementById('articleModal')).hide();
            loadArticleList();
        }else{
            alert("保存失败："+data.message);
        }
    }

    // 删除文章 blog接口
    async function delArticle(id){
        if(!confirm("确认删除？")) return;
        const res = await fetch(`${baseUrl}/blog/article/delete/${id}`,{
            method:"POST",
            headers:{"Authorization":token}
        })
        const data = await res.json();
        if(data.code ===200){
            alert("删除成功");
            loadArticleList();
        }else{
            alert("删除失败："+data.message);
        }
    }
</script>
</body>
</html>
